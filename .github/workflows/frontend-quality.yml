name: Frontend Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feat/**

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VITE_API_URL: http://localhost:6969/api/v1
  VITE_APP_URL: http://localhost:3000
  VITE_GIPHY_API_KEY: ci-giphy-key
  VITE_GOOGLE_CLIENT_ID: ci-google-client-id
  VITE_GOOGLE_MAPS_API_KEY: ci-google-maps-key
  VITE_MEDIA_BASE_URL: ""

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend quality gate
        env:
          OXLINT_THREADS: "1"
          VERIFY_MAX_PARALLEL: "1"
        run: npm run check:pr
