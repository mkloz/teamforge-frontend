name: Frontend Algorithms

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feat/**

jobs:
  algorithms:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run algorithm tests
        run: npm run test:unit
