name: Frontend Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Cloudflare Pages environment to deploy
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      pages_branch:
        description: Optional Pages branch alias; production uses the configured production branch
        required: false
        type: string
        default: ""

concurrency:
  group: frontend-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release verification and security gates
        env:
          OXLINT_THREADS: "1"
          SENTRY_RELEASE: ${{ github.sha }}
          VERIFY_MAX_PARALLEL: "1"
          VITE_API_URL: https://api.findafew.today/findafew/api/v1
          VITE_APP_URL: https://findafew.today
          VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.deploy_target || 'production' }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE || '0' }}
        run: npm run check:release

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'findafew-web' }}
          PAGES_BRANCH_INPUT: ${{ inputs.pages_branch }}
          PAGES_DEPLOY_TARGET: ${{ inputs.deploy_target || 'production' }}
          PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME"

          pages_branch="${PAGES_BRANCH_INPUT:-}"

          if [[ "$PAGES_DEPLOY_TARGET" == "production" ]]; then
            pages_branch="$PAGES_PRODUCTION_BRANCH"
          elif [[ -z "$pages_branch" ]]; then
            pages_branch="$GITHUB_REF_NAME"
          fi

          echo "Deploying dist to Cloudflare Pages project '$CLOUDFLARE_PAGES_PROJECT_NAME' on branch '$pages_branch'"
          npx wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$pages_branch"
