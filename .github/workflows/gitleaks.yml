name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Scan for secrets
        run: node scripts/security/gitleaks.mjs

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-gitleaks-${{ github.run_id }}
          path: reports/gitleaks.md
          if-no-files-found: warn
          retention-days: 14
