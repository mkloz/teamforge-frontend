info:
  title: TeamForge API
  description:
    TeamForge API for accounts, profiles, activity-based group
    formation, shared plans, conversations, invitations, and notifications.
  version: '1.0'
  contact: {}
  license:
    name: LICENSE
    url: https://github.com/mkloz/teamforge-backend
tags: []
servers:
  - url: /
    description: Current host
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste a JWT access token.
    operatorAssertion:
      type: apiKey
      in: header
      name: x-teamforge-operator-assertion
      description: Short-lived RS256 operator assertion injected by the trusted proxy.
  schemas:
    AdultEligibilitySummaryEntity:
      type: object
      properties:
        status:
          type: string
          enum:
            - ELIGIBLE
            - NOT_ELIGIBLE
            - REVIEW_REQUIRED
            - UNKNOWN
        accessVersion:
          type: number
          example: 1
      required:
        - status
        - accessVersion
    SetAdultEligibilityDto:
      type: object
      properties:
        dateOfBirth:
          type: string
          example: 2000-06-15
          format: date
          writeOnly: true
      required:
        - dateOfBirth
    UrlResponse:
      type: object
      properties:
        url:
          type: string
          example: https://example.com
      required:
        - url
    PersonalityOceanEntity:
      type: object
      properties:
        openness:
          type: integer
          minimum: 0
          maximum: 100
        conscientiousness:
          type: integer
          minimum: 0
          maximum: 100
        extraversion:
          type: integer
          minimum: 0
          maximum: 100
        agreeableness:
          type: integer
          minimum: 0
          maximum: 100
        neuroticism:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - openness
        - conscientiousness
        - extraversion
        - agreeableness
        - neuroticism
    OwnerPersonalityAssessmentEntity:
      type: object
      properties:
        assessmentId:
          type: string
        instrumentVersion:
          type: string
        scoringVersion:
          type: string
        displayVersion:
          type: string
        personalityType:
          type: string
          example: INFP
        ocean:
          $ref: '#/components/schemas/PersonalityOceanEntity'
        lifecycle:
          type: string
          enum:
            - DRAFT_RESULT
            - CURRENT
            - SUPERSEDED
            - DELETED
        provenance:
          type: string
          enum:
            - ASSESSMENT_DERIVED
            - LEGACY_CLIENT_RESULT
        source:
          type: string
          enum:
            - ONBOARDING
            - RETAKE
            - MIGRATION
        quality:
          type: string
          enum:
            - COMPLETE
            - LEGACY_UNVERIFIED
        compatibilityEligible:
          type: boolean
        formVersion:
          type: string
        completedAt:
          format: date-time
          type: string
          nullable: true
      required:
        - assessmentId
        - instrumentVersion
        - scoringVersion
        - displayVersion
        - personalityType
        - ocean
        - lifecycle
        - provenance
        - source
        - quality
        - compatibilityEligible
        - formVersion
        - completedAt
    PublicPersonalityProfileEntity:
      type: object
      properties:
        assessmentId:
          type: string
        instrumentVersion:
          type: string
        scoringVersion:
          type: string
        displayVersion:
          type: string
        personalityType:
          type: string
          example: INFP
        ocean:
          $ref: '#/components/schemas/PersonalityOceanEntity'
      required:
        - assessmentId
        - instrumentVersion
        - scoringVersion
        - displayVersion
        - personalityType
        - ocean
    PersonalityDisclosureEntity:
      type: object
      properties:
        policyVersion:
          type: string
        publicFields:
          type: array
          items:
            type: string
        purposeVersion:
          type: string
        authorizedAudiences:
          type: array
          items:
            type: string
        assessmentDisplayVersion:
          type: string
        compatibilitySchemaVersion:
          type: string
        methodologyVersion:
          type: string
      required:
        - policyVersion
        - publicFields
        - purposeVersion
        - authorizedAudiences
        - assessmentDisplayVersion
        - compatibilitySchemaVersion
        - methodologyVersion
    PersonalityPublicationEntity:
      type: object
      properties:
        decision:
          type: string
          enum:
            - GRANTED
            - REVOKED
          nullable: true
        sequence:
          type: integer
          minimum: 0
      required:
        - decision
        - sequence
    OwnerPersonalityStateEntity:
      type: object
      properties:
        assessmentGeneration:
          type: integer
          minimum: 0
        draft:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/OwnerPersonalityAssessmentEntity'
        current:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/OwnerPersonalityAssessmentEntity'
        publicProfile:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/PublicPersonalityProfileEntity'
        disclosure:
          $ref: '#/components/schemas/PersonalityDisclosureEntity'
        publication:
          $ref: '#/components/schemas/PersonalityPublicationEntity'
      required:
        - assessmentGeneration
        - draft
        - current
        - publicProfile
        - disclosure
        - publication
    CreateAssessmentAttemptDto:
      type: object
      properties:
        formVersion:
          type: string
          enum:
            - IPIP_30_V1
            - IPIP_50_V1
            - IPIP_150_V1
        source:
          type: string
          enum:
            - ONBOARDING
            - RETAKE
      required:
        - formVersion
        - source
    AssessmentAttemptEntity:
      type: object
      properties:
        attemptId:
          type: string
        formVersion:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - attemptId
        - formVersion
        - expiresAt
    PersonalityAnswerDto:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
          maximum: 150
        value:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          minimum: 1
          maximum: 5
      required:
        - questionId
        - value
    SubmitAssessmentDto:
      type: object
      properties:
        answers:
          minItems: 30
          maxItems: 150
          type: array
          items:
            $ref: '#/components/schemas/PersonalityAnswerDto'
      required:
        - answers
    SubmittedPersonalityAssessmentEntity:
      type: object
      properties:
        assessment:
          $ref: '#/components/schemas/OwnerPersonalityAssessmentEntity'
        publicProjectionPreview:
          $ref: '#/components/schemas/PublicPersonalityProfileEntity'
        disclosure:
          $ref: '#/components/schemas/PersonalityDisclosureEntity'
      required:
        - assessment
        - publicProjectionPreview
        - disclosure
    PublishPersonalityDto:
      type: object
      properties:
        acknowledged:
          type: boolean
          enum:
            - true
        policyVersion:
          type: string
          example: personality-publication-v1
      required:
        - acknowledged
        - policyVersion
    InterestEntity:
      type: object
      properties:
        id:
          type: string
          example: clx1interest123
        name:
          type: string
          example: Basketball
        slug:
          type: string
          example: basketball
        description:
          type: string
          example: Indoor and outdoor basketball games
        icon:
          type: string
          example: basketball
        color:
          type: string
          example: '#F97316'
        sortOrder:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true
        parentId:
          type: string
          example: clx1category123
        aliases:
          example:
            - hoops
            - pickup
          type: array
          items:
            type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - id
        - name
        - slug
        - sortOrder
        - isActive
        - aliases
    UserEntity:
      type: object
      properties:
        id:
          type: string
          example: clv123abc
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        avatar:
          type: string
          example: https://example.com/avatar.png
          nullable: true
        bio:
          type: string
          example: Software engineer and hiking enthusiast
          nullable: true
        authProvider:
          type: string
          enum:
            - EMAIL
            - GOOGLE
        emailVerified:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        updatedAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        age:
          type: number
          example: 25
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
        personalityType:
          type: string
          example: ENTJ
        oceanO:
          type: number
          example: 80
        oceanC:
          type: number
          example: 80
        oceanE:
          type: number
          example: 80
        oceanA:
          type: number
          example: 80
        oceanN:
          type: number
          example: 80
        searchStatus:
          type: string
          enum:
            - IDLE
            - SEARCHING
        trustScore:
          type: number
          example: 0.5
        profileComplete:
          type: boolean
          example: false
        personalitySetupComplete:
          type: boolean
          example: false
        adultEligibility:
          $ref: '#/components/schemas/AdultEligibilitySummaryEntity'
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - id
        - name
        - email
        - avatar
        - bio
        - authProvider
        - emailVerified
        - createdAt
        - updatedAt
        - searchStatus
        - trustScore
        - profileComplete
        - personalitySetupComplete
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    PublicUserEntity:
      type: object
      properties:
        id:
          type: string
          example: clv123abc
        name:
          type: string
          example: John Doe
        avatar:
          type: string
          example: https://example.com/avatar.png
        bio:
          type: string
          example: Software engineer and hiking enthusiast
        canReport:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        age:
          type: number
          example: 25
          nullable: true
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
          nullable: true
        city:
          type: string
          example: London
          nullable: true
        showFriendsListOnProfile:
          type: boolean
          example: true
        trustScore:
          type: number
          example: 0.82
          minimum: 0
          maximum: 1
        viewerContext:
          type: string
          enum:
            - SELF
            - CURRENT_GROUP
            - ACCEPTED_FRIEND
            - MINIMAL
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
        personalityProfile:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/PublicPersonalityProfileEntity'
      required:
        - id
        - name
        - canReport
        - createdAt
        - age
        - gender
        - city
        - showFriendsListOnProfile
        - trustScore
        - viewerContext
        - interests
        - personalityProfile
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        bio:
          type: string
          example: Hiking enthusiast
        age:
          type: number
          example: 25
        dateOfBirth:
          type: string
          example: 2000-06-15
          format: date
          writeOnly: true
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        password:
          type: string
          example: ExamplePassphrase123!
      required:
        - email
        - password
    Tokens:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
      required:
        - accessToken
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        password:
          type: string
          example: ExamplePassphrase123!
        name:
          type: string
          example: John Doe
        bio:
          type: string
          example: Software engineer who enjoys hiking and board games.
        age:
          type: number
          example: 23
        dateOfBirth:
          type: string
          example: 2000-06-15
          format: date
          writeOnly: true
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
          example: NON_BINARY
      required:
        - email
        - password
        - name
    VerifyEmailOtpDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        code:
          type: string
          example: '123456'
      required:
        - email
        - code
    EmailDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
      required:
        - email
    AuthSessionEntity:
      type: object
      properties:
        id:
          type: string
          example: 08aa78d7-65ce-4bb7-92e7-a0c7274f868d
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        ipAddress:
          type: string
          example: 203.0.113.18
          nullable: true
        createdAt:
          format: date-time
          type: string
          example: 2026-04-29T21:00:00.000Z
        expiresAt:
          format: date-time
          type: string
          example: 2026-05-06T21:00:00.000Z
        isCurrent:
          type: boolean
          example: true
      required:
        - id
        - userAgent
        - createdAt
        - expiresAt
        - isCurrent
    AuthSessionListEntity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthSessionEntity'
      required:
        - items
    AuthRefreshResult:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
        currentUser:
          description:
            Current user returned with the refreshed tokens so the client can
            load authenticated routes.
          allOf:
            - $ref: '#/components/schemas/UserEntity'
      required:
        - accessToken
        - currentUser
    ResetPasswordDto:
      type: object
      properties:
        password:
          type: string
          example: ExamplePassphrase123!
        token:
          type: string
      required:
        - password
        - token
    AuthGoogleLoginDto:
      type: object
      properties:
        code:
          type: string
          example: abc
        intent:
          type: string
          example: login
          enum:
            - login
            - register
          description:
            Whether the frontend started Google sign-in from login or
            registration
      required:
        - code
    AuthResult:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
        isNewUser:
          type: boolean
          example: true
          description: Whether this request created a new account
      required:
        - accessToken
        - isNewUser
    PaginationMeta:
      type: object
      properties:
        totalItemsCount:
          type: number
          example: 1
        itemsPerPage:
          type: number
          example: 20
        currentPage:
          type: number
          example: 1
        totalPages:
          type: number
          example: 1
      required:
        - totalItemsCount
        - itemsPerPage
        - currentPage
        - totalPages
    PaginatedInterests:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - meta
        - items
    SetUserInterestsDto:
      type: object
      properties:
        interestIds:
          example:
            - clx1interest1
            - clx1interest2
            - clx1interest3
            - clx1interest4
            - clx1interest5
          minItems: 5
          maxItems: 50
          type: array
          items:
            type: string
      required:
        - interestIds
    UserInterestsEntity:
      type: object
      properties:
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - interests
    CreateActivityDto:
      type: object
      properties:
        title:
          type: string
          example: Friday basketball run
        description:
          type: string
          example: Looking for a small group for evening hoops
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5072
        locationLng:
          type: number
          example: -0.1276
        visibility:
          type: string
          enum:
            - PUBLIC
            - FRIENDS_ONLY
            - INVITE_ONLY
          default: PUBLIC
        access:
          type: string
          enum:
            - OPEN
            - BY_REQUEST
          default: OPEN
        forgeMode:
          type: string
          enum:
            - AUTO
            - MANUAL
          default: AUTO
        interestIds:
          example:
            - clx1interest1
            - clx1interest2
          minItems: 1
          maxItems: 20
          type: array
          items:
            type: string
      required:
        - title
        - interestIds
    ActivityPlanTemplateEntity:
      type: object
      properties:
        id:
          type: string
          example: clx1plan123
        title:
          type: string
          example: Friday evening basketball
        description:
          type: string
          example: Casual pickup game with room for beginners
          nullable: true
        category:
          type: string
          enum:
            - TECH
            - SPORTS
            - ARTS
            - SOCIAL
            - OUTDOORS
            - LEARNING
            - MUSIC
            - FOOD
            - GAMING
            - WELLNESS
            - TRAVEL
            - OTHER
        coverImage:
          type: string
          example: https://example.com/plan-cover.png
          nullable: true
        status:
          type: string
          enum:
            - DRAFT
            - PROPOSED
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        scheduleMode:
          type: string
          enum:
            - TO_BE_DECIDED
            - FIXED
          nullable: true
        dateTime:
