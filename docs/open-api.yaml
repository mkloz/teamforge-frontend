                    description: HTTP status code.
                  message:
                    description: Error message.
                    type: object
                    properties:
                      status:
                        type: string
                        example: error
                      info:
                        type: object
                        example: *a5
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example:
                          redis: &a7
                            status: down
                            message: Could not connect
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example:
                          database: *a6
                          redis: *a7
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                  timestamp:
                    example: 2023-08-20T12:34:56Z
                    type: string
                    format: date-time
                    description: Timestamp when the exception occurred.
                  method:
                    example: GET
                    type: string
                    description: HTTP method that triggered the exception.
                  path:
                    example: /api/resource
                    type: string
                    description: Request path that triggered the exception.
                  requestId:
                    example: 4a5f8f3b-7f37-4fb7-9b0f-7d9b69f3b65f
                    type: string
                    description: Stable request identifier for log correlation.
                required:
                  - status
                  - timestamp
                  - method
                  - requestId
