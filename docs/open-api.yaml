info:
  title: Findafew API
  description:
    Findafew API for accounts, profiles, activity-based group
    formation, shared plans, conversations, invitations, and notifications.
  version: '1.0'
  contact: {}
  license:
    name: LICENSE
    url: https://github.com/mkloz/findafew-backend
tags: []
servers:
  - url: https://api.findafew.today/findafew
    description:
      Production public gateway. Paths already include the internal
      /api/v1 prefix.
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste a JWT access token.
    operatorAssertion:
      type: apiKey
      in: header
      name: x-findafew-operator-assertion
      description: Short-lived RS256 operator assertion injected by the trusted proxy.
  schemas:
    AdultEligibilitySummaryEntity:
      type: object
      properties:
        status:
          type: string
          enum:
            - ELIGIBLE
            - NOT_ELIGIBLE
            - REVIEW_REQUIRED
            - UNKNOWN
        accessVersion:
          type: number
          example: 1
      required:
        - status
        - accessVersion
    SetAdultEligibilityDto:
      type: object
      properties:
        dateOfBirth:
          type: string
          example: 2000-06-15
          format: date
          writeOnly: true
      required:
        - dateOfBirth
    AdultEligibilityCorrectionEntity:
      type: object
      properties:
        id:
          type: string
          example: correction-id
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
            - REJECTED
            - CANCELLED
        reasonCode:
          type: string
          enum:
            - INCORRECT_DATE_OF_BIRTH
            - INCORRECT_ELIGIBILITY_STATUS
            - OTHER
        resolutionReasonCode:
          type: string
          enum:
            - CORRECTION_VERIFIED
            - CORRECTION_NOT_VERIFIED
            - DUPLICATE_REQUEST
          nullable: true
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        resultingAccessVersion:
          type: number
          nullable: true
        resultingAuthorityVersion:
          type: number
          nullable: true
        canCancel:
          type: boolean
        canRequestAnother:
          type: boolean
      required:
        - id
        - status
        - reasonCode
        - requestedAt
        - canCancel
        - canRequestAnother
    AdultEligibilityCorrectionResponseEntity:
      type: object
      properties:
        request:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/AdultEligibilityCorrectionEntity'
      required:
        - request
    CreateAdultEligibilityCorrectionDto:
      type: object
      properties:
        dateOfBirth:
          type: string
          example: 2000-06-15
          format: date
          writeOnly: true
      required:
        - dateOfBirth
    UrlResponse:
      type: object
      properties:
        url:
          type: string
          example: https://example.com
      required:
        - url
    DynamicPersonalityCapabilityEntity:
      type: object
      properties:
        startPolicy:
          type: string
          enum:
            - HIDDEN
            - INTERNAL
            - PUBLIC_BETA
            - AVAILABLE
            - PAUSED
        resumePolicy:
          type: string
          enum:
            - NOT_SUPPORTED_V1
        pageSize:
          type: integer
        minimumPages:
          type: integer
        maximumPages:
          type: integer
        minimumQuestions:
          type: integer
        maximumQuestions:
          type: integer
        displayUse:
          type: string
          enum:
            - ENABLED
            - DISABLED
        publicationUse:
          type: string
          enum:
            - ENABLED
            - DISABLED
        compatibilityUse:
          type: string
          enum:
            - ENABLED
            - DISABLED_PENDING_LINK
        onboardingUse:
          type: string
          enum:
            - ENABLED
            - DISABLED
        packageId:
          type: string
        manifestHash:
          type: string
        policyVersion:
          type: string
      required:
        - startPolicy
        - resumePolicy
        - pageSize
        - minimumPages
        - maximumPages
        - minimumQuestions
        - maximumQuestions
        - displayUse
        - publicationUse
        - compatibilityUse
        - onboardingUse
        - packageId
        - manifestHash
        - policyVersion
    PersonalityAssessmentCapabilitiesEntity:
      type: object
      properties:
        availableFixedForms:
          type: array
          items:
            type: string
            enum:
              - IPIP_30_V1
              - IPIP_50_V1
        retiredForms:
          type: array
          items:
            type: string
            enum:
              - IPIP_150_V1
        dynamic:
          $ref: '#/components/schemas/DynamicPersonalityCapabilityEntity'
      required:
        - availableFixedForms
        - retiredForms
        - dynamic
    PersonalityOceanEntity:
      type: object
      properties:
        openness:
          type: integer
          minimum: 0
          maximum: 100
        conscientiousness:
          type: integer
          minimum: 0
          maximum: 100
        extraversion:
          type: integer
          minimum: 0
          maximum: 100
        agreeableness:
          type: integer
          minimum: 0
          maximum: 100
        neuroticism:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - openness
        - conscientiousness
        - extraversion
        - agreeableness
        - neuroticism
    PersonalityTraitUncertaintyEntity:
      type: object
      properties:
        lower90:
          type: integer
          minimum: 0
          maximum: 100
        posteriorSd:
          type: number
          minimum: 0
        upper90:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - lower90
        - posteriorSd
        - upper90
    PersonalityTraitUncertaintiesEntity:
      type: object
      properties:
        openness:
          $ref: '#/components/schemas/PersonalityTraitUncertaintyEntity'
        conscientiousness:
          $ref: '#/components/schemas/PersonalityTraitUncertaintyEntity'
        extraversion:
          $ref: '#/components/schemas/PersonalityTraitUncertaintyEntity'
        agreeableness:
          $ref: '#/components/schemas/PersonalityTraitUncertaintyEntity'
        neuroticism:
          $ref: '#/components/schemas/PersonalityTraitUncertaintyEntity'
      required:
        - openness
        - conscientiousness
        - extraversion
        - agreeableness
        - neuroticism
    PersonalityAssessmentMeasurementEntity:
      type: object
      properties:
        mode:
          type: string
          enum:
            - FIXED
            - DYNAMIC
        questionCount:
          type: integer
          minimum: 1
        stopReason:
          type: string
          enum:
            - FIXED_LENGTH
            - PRECISION_REACHED
            - MAXIMUM_REACHED
          nullable: true
        uncertainty:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/PersonalityTraitUncertaintiesEntity'
      required:
        - mode
        - questionCount
        - stopReason
        - uncertainty
    OwnerPersonalityAssessmentEntity:
      type: object
      properties:
        assessmentId:
          type: string
        instrumentVersion:
          type: string
        scoringVersion:
          type: string
        displayVersion:
          type: string
        personalityType:
          type: string
          example: INFP
        ocean:
          $ref: '#/components/schemas/PersonalityOceanEntity'
        lifecycle:
          type: string
          enum:
            - DRAFT_RESULT
            - CURRENT
            - SUPERSEDED
            - DELETED
        provenance:
          type: string
          enum:
            - ASSESSMENT_DERIVED
            - LEGACY_CLIENT_RESULT
        source:
          type: string
          enum:
            - ONBOARDING
            - RETAKE
            - MIGRATION
        quality:
          type: string
          enum:
            - COMPLETE
            - LEGACY_UNVERIFIED
        compatibilityEligible:
          type: boolean
        formVersion:
          type: string
        completedAt:
          format: date-time
          type: string
          nullable: true
        measurement:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/PersonalityAssessmentMeasurementEntity'
      required:
        - assessmentId
        - instrumentVersion
        - scoringVersion
        - displayVersion
        - personalityType
        - ocean
        - lifecycle
        - provenance
        - source
        - quality
        - compatibilityEligible
        - formVersion
        - completedAt
        - measurement
    PublicPersonalityProfileEntity:
      type: object
      properties:
        assessmentId:
          type: string
        instrumentVersion:
          type: string
        scoringVersion:
          type: string
        displayVersion:
          type: string
        personalityType:
          type: string
          example: INFP
        ocean:
          $ref: '#/components/schemas/PersonalityOceanEntity'
      required:
        - assessmentId
        - instrumentVersion
        - scoringVersion
        - displayVersion
        - personalityType
        - ocean
    PersonalityDisclosureEntity:
      type: object
      properties:
        policyVersion:
          type: string
        publicFields:
          type: array
          items:
            type: string
        purposeVersion:
          type: string
        authorizedAudiences:
          type: array
          items:
            type: string
        assessmentDisplayVersion:
          type: string
        compatibilitySchemaVersion:
          type: string
        methodologyVersion:
          type: string
      required:
        - policyVersion
        - publicFields
        - purposeVersion
        - authorizedAudiences
        - assessmentDisplayVersion
        - compatibilitySchemaVersion
        - methodologyVersion
    PersonalityPublicationEntity:
      type: object
      properties:
        decision:
          type: string
          enum:
            - GRANTED
            - REVOKED
          nullable: true
        sequence:
          type: integer
          minimum: 0
      required:
        - decision
        - sequence
    OwnerPersonalityStateEntity:
      type: object
      properties:
        assessmentGeneration:
          type: integer
          minimum: 0
        draft:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/OwnerPersonalityAssessmentEntity'
        current:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/OwnerPersonalityAssessmentEntity'
        publicProfile:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/PublicPersonalityProfileEntity'
        disclosure:
          $ref: '#/components/schemas/PersonalityDisclosureEntity'
        publication:
          $ref: '#/components/schemas/PersonalityPublicationEntity'
      required:
        - assessmentGeneration
        - draft
        - current
        - publicProfile
        - disclosure
        - publication
    CreateAssessmentAttemptDto:
      type: object
      properties:
        formVersion:
          type: string
          enum:
            - IPIP_30_V1
            - IPIP_50_V1
            - IPIP_150_V1
            - FINDAFEW_OCEAN_DYNAMIC_V1
        source:
          type: string
          enum:
            - ONBOARDING
            - RETAKE
        baseAssessmentGeneration:
          type: integer
          minimum: 0
        packageId:
          type: string
        manifestHash:
          type: string
        selectionSeed:
          type: string
          format: uuid
      required:
        - formVersion
        - source
    AssessmentAttemptEntity:
      type: object
      properties:
        attemptId:
          type: string
        formVersion:
          type: string
        expiresAt:
          format: date-time
          type: string
        packageId:
          type: string
        manifestHash:
          type: string
      required:
        - attemptId
        - formVersion
        - expiresAt
    PersonalityAnswerDto:
      type: object
      properties:
        questionId:
          type: integer
          minimum: 1
          maximum: 150
        value:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          minimum: 1
          maximum: 5
      required:
        - questionId
        - value
    DynamicAssessmentPageDto:
      type: object
      properties:
        pageNumber:
          type: integer
          minimum: 1
          maximum: 10
        itemVersionIds:
          minItems: 5
          maxItems: 5
          type: array
          items:
            type: string
      required:
        - pageNumber
        - itemVersionIds
    DynamicAssessmentAnswerDto:
      type: object
      properties:
        itemVersionId:
          type: string
        value:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
      required:
        - itemVersionId
        - value
    DynamicAssessmentSubmissionDto:
      type: object
      properties:
        packageId:
          type: string
        manifestHash:
          type: string
        selectionSeed:
          type: string
        pages:
          minItems: 6
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/DynamicAssessmentPageDto'
        answers:
          minItems: 30
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/DynamicAssessmentAnswerDto'
      required:
        - packageId
        - manifestHash
        - selectionSeed
        - pages
        - answers
    SubmitAssessmentDto:
      type: object
      properties:
        answers:
          minItems: 30
