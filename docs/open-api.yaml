openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example:
                      Hello! This is the root endpoint. Please use /api/v1 for the API. Docs
                      are available at /api/v1/docs.
                required:
                  - message
        '429':
          description: Too many requests
      summary: Get the API root message and documentation entrypoint
      tags:
        - App
      security: []
  /api/v1/file-upload/image:
    post:
      operationId: FileUploadController_uploadImage
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'
        '429':
          description: Too many requests
      summary: Upload an image and return its public URL
      tags: &a1
        - File uploads
  /api/v1/file-upload/chat-attachment:
    post:
      operationId: FileUploadController_uploadChatAttachment
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'
        '429':
          description: Too many requests
      summary: Upload a chat attachment and return its download URL
      tags: *a1
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      info:
                        type: object
                        example: &a2
                          database: &a3
                            status: up
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example: {}
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example: *a2
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
        '429':
          description: Too many requests
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    example: 503
                    type: integer
                    description: HTTP status code.
                  message:
                    description: Error message.
                    type: object
                    properties:
                      status:
                        type: string
                        example: error
                      info:
                        type: object
                        example: *a2
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example:
                          redis: &a4
                            status: down
                            message: Could not connect
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example:
                          database: *a3
                          redis: *a4
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                  timestamp:
                    example: 2023-08-20T12:34:56Z
                    type: string
                    format: date-time
                    description: Timestamp when the exception occurred.
                  method:
                    example: GET
                    type: string
                    description: HTTP method that triggered the exception.
                  path:
                    example: /api/resource
                    type: string
                    description: Request path that triggered the exception.
                  requestId:
                    example: 4a5f8f3b-7f37-4fb7-9b0f-7d9b69f3b65f
                    type: string
                    description: Stable request identifier for log correlation.
                required:
                  - status
                  - timestamp
                  - method
                  - requestId
      summary: Check backend dependencies
      tags: &a8
        - Health
      security: []
  /api/v1/health/frontend:
    get:
