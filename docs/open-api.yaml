    post:
      operationId: RatingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRatingResultEntity'
        '429':
          description: Too many requests
      security: *a30
      summary: Submit ratings for your group experience
      tags: *a31
