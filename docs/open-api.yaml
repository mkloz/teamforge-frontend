  description: TeamForge is an intelligent social platform that forms small,
    compatible groups of people for shared real-world activities. It targets
    students and young professionals aged 18–28 who want to meet like-minded
    people without the friction of traditional social discovery.
  version: '1.0'
  contact: {}
  license:
    name: LICENSE
    url: https://github.com/mkloz/teamforge-backend
tags: []
servers:
  - url: /
    description: Current host
