                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      info:
                        type: object
                        example: &a4
                          database: &a5
                            status: up
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example: {}
                        additionalProperties:
                          type: object
                          properties:
                            status:
