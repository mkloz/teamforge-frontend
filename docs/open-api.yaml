        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - FRIEND_REQUEST
              - FRIEND_ACCEPTED
              - GROUP_FORMED
              - GROUP_INVITE
              - GROUP_JOIN_REQUEST
              - GROUP_JOIN_APPROVED
              - GROUP_MEMBER_LEFT
              - GROUP_DISBANDED
              - PLAN_CREATED
              - PLAN_CONFIRMED
              - PLAN_UPDATED
              - PLAN_PROPOSAL
              - PLAN_STARTING_SOON
              - PLAN_COMPLETED
              - PLAN_CANCELLED
              - NEW_MESSAGE
              - MESSAGE_MENTION
              - RATING_REQUEST
              - RATING_RECEIVED
              - SYSTEM_ANNOUNCEMENT
              - ACCOUNT_SECURITY
        - name: isRead
          required: false
          in: query
          description: Filter notifications by read state
          schema:
            example: false
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotifications'
        '429':
          description: Too many requests
      security: &a29
        - bearer: []
      summary: List your notifications
      tags: &a30
        - Notifications
  /api/v1/notifications/unread-count:
    get:
      operationId: NotificationsController_getUnreadCount
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Get your unread notification count
      tags: *a30
  /api/v1/notifications/web-push/public-key:
    get:
      operationId: NotificationsController_getWebPushPublicKey
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPushPublicKeyEntity'
        '429':
          description: Too many requests
      security: []
      summary: Get the web push public key and enabled state
      tags: *a30
  /api/v1/notifications/web-push/subscriptions:
    get:
      operationId: NotificationsController_getWebPushSubscriptions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebPushSubscriptionEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: List your active web push subscriptions
      tags: *a30
    post:
      operationId: NotificationsController_upsertWebPushSubscription
      parameters:
        - name: user-agent
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertWebPushSubscriptionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPushSubscriptionEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Create or refresh a web push subscription
      tags: *a30
    delete:
      operationId: NotificationsController_deleteWebPushSubscription
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWebPushSubscriptionDto'
      responses:
        '200':
          description: Subscription disabled
        '429':
          description: Too many requests
      security: *a29
      summary: Disable one of your web push subscriptions
      tags: *a30
  /api/v1/notifications/web-push/test:
    post:
      operationId: NotificationsController_sendTestWebPushNotification
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPushTestDispatchEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Send the current user a test web push notification
      tags: *a30
  /api/v1/notifications/{id}/read:
    post:
      operationId: NotificationsController_markRead
      parameters:
        - name: id
          required: true
          in: path
          description: Notification ID
          schema:
            example: ckaqbclqnwqwfewgwsef
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Mark one notification as read
      tags: *a30
  /api/v1/notifications/{id}/unread:
    post:
      operationId: NotificationsController_markUnread
      parameters:
        - name: id
          required: true
          in: path
          description: Notification ID
          schema:
            example: ckaqbclqnwqwfewgwsef
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Mark one notification as unread
      tags: *a30
  /api/v1/notifications/read-all:
    post:
      operationId: NotificationsController_markAllRead
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountEntity'
        '429':
          description: Too many requests
      security: *a29
      summary: Mark all of your notifications as read
      tags: *a30
  /api/v1/ratings/groups/{id}:
    get:
      operationId: RatingsController_getGroupRatings
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: ckaqbclqnwqwfewgwsef
            type: string
        - name: page
          required: false
          in: query
          schema:
            maximum: 500
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            maximum: 100
            default: 10
            type: number
        - name: rateeId
          required: false
          in: query
          description: Filter ratings by the member who was rated
          schema:
            example: clx1user456
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatings'
        '429':
          description: Too many requests
      security: &a31
        - bearer: []
      summary: List ratings for a completed group you participated in
      tags: &a32
        - Ratings
  /api/v1/ratings/groups/{id}/review-state:
    get:
      operationId: RatingsController_getGroupReviewState
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: ckaqbclqnwqwfewgwsef
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupReviewStateEntity'
        '429':
          description: Too many requests
      security: *a31
      summary: Get the current review prompt state for a completed group plan
      tags: *a32
  /api/v1/ratings:
    post:
      operationId: RatingsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRatingResultEntity'
        '409':
          description:
            The group plan is not complete, the plan is no longer current, or
            this rating was already submitted
        '429':
          description: Too many requests
      security: *a31
      summary: Submit a rating for a member of your completed group plan
      tags: *a32
  /api/v1/ratings/groups/{id}/review-deferrals:
    post:
      operationId: RatingsController_deferGroupReview
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: ckaqbclqnwqwfewgwsef
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferGroupReviewDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupReviewStateEntity'
        '409':
          description:
            The group plan is not complete, the plan is no longer current, or
            no reviews are pending
        '429':
          description: Too many requests
      security: *a31
      summary: Defer the completed-plan review prompt until the next plan
      tags: *a32
  /api/v1/settings/me:
    get:
      operationId: SettingsController_getMySettings
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsEntity'
        '429':
          description: Too many requests
      security: &a33
        - bearer: []
      summary: Get settings for the authenticated user
      tags: &a34
        - Settings
    patch:
      operationId: SettingsController_updateMySettings
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsEntity'
        '429':
          description: Too many requests
      security: *a33
      summary: Update settings for the authenticated user
      tags: *a34
info:
  title: TeamForge API
  description:
    TeamForge API for accounts, profiles, activity-based group
    formation, shared plans, conversations, invitations, and notifications.
  version: '1.0'
  contact: {}
  license:
    name: LICENSE
    url: https://github.com/mkloz/teamforge-backend
tags: []
servers:
  - url: /
    description: Current host
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste a JWT access token.
  schemas:
    UrlResponse:
      type: object
      properties:
        url:
          type: string
          example: https://example.com
      required:
        - url
    InterestEntity:
      type: object
      properties:
        id:
          type: string
          example: clx1interest123
        name:
          type: string
          example: Basketball
        slug:
          type: string
          example: basketball
        description:
          type: string
          example: Indoor and outdoor basketball games
        icon:
          type: string
          example: basketball
        color:
          type: string
          example: '#F97316'
        sortOrder:
          type: number
          example: 1
        isActive:
          type: boolean
          example: true
        parentId:
          type: string
          example: clx1category123
        aliases:
          example:
            - hoops
            - pickup
          type: array
          items:
            type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - id
        - name
        - slug
        - sortOrder
        - isActive
        - aliases
    UserEntity:
      type: object
      properties:
        id:
          type: string
          example: clv123abc
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        avatar:
          type: string
          example: https://example.com/avatar.png
        bio:
          type: string
          example: Software engineer and hiking enthusiast
        authProvider:
          type: string
          enum:
            - EMAIL
            - GOOGLE
        emailVerified:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        updatedAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        age:
          type: number
          example: 25
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
        personalityType:
          type: string
          example: ENTJ
        oceanO:
          type: number
          example: 80
        oceanC:
          type: number
          example: 80
        oceanE:
          type: number
          example: 80
        oceanA:
          type: number
          example: 80
        oceanN:
          type: number
          example: 80
        searchStatus:
          type: string
          enum:
            - IDLE
            - SEARCHING
        trustScore:
          type: number
          example: 0.5
        profileComplete:
          type: boolean
          example: false
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - id
        - name
        - email
        - authProvider
        - emailVerified
        - createdAt
        - updatedAt
        - searchStatus
        - trustScore
        - profileComplete
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    PublicUserEntity:
      type: object
      properties:
        id:
          type: string
          example: clv123abc
        name:
          type: string
          example: John Doe
        avatar:
          type: string
          example: https://example.com/avatar.png
        bio:
          type: string
          example: Software engineer and hiking enthusiast
        createdAt:
          format: date-time
          type: string
          example: 2024-01-01T00:00:00Z
        age:
          type: number
          example: 25
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
        city:
          type: string
          example: London
        personalityType:
          type: string
          example: ENTJ
        oceanO:
          type: number
          example: 80
        oceanC:
          type: number
          example: 80
        oceanE:
          type: number
          example: 80
        oceanA:
          type: number
          example: 80
        oceanN:
          type: number
          example: 80
        trustScore:
          type: number
          example: 0.5
        showFriendsListOnProfile:
          type: boolean
          example: true
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - id
        - name
        - createdAt
        - trustScore
        - showFriendsListOnProfile
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        bio:
          type: string
          example: Hiking enthusiast
        age:
          type: number
          example: 25
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
        personalityType:
          type: string
          example: ENTJ
        oceanO:
          type: number
          example: 80
        oceanC:
          type: number
          example: 80
        oceanE:
          type: number
          example: 80
        oceanA:
          type: number
          example: 80
        oceanN:
          type: number
          example: 80
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        password:
          type: string
          example: ExamplePassphrase123!
      required:
        - email
        - password
    Tokens:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
      required:
        - accessToken
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        password:
          type: string
          example: ExamplePassphrase123!
        name:
          type: string
          example: John Doe
        bio:
          type: string
          example: Software engineer who enjoys hiking and board games.
        age:
          type: number
          example: 23
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5074
          nullable: true
        locationLng:
          type: number
          example: -0.1278
          nullable: true
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - NON_BINARY
            - OTHER
          example: NON_BINARY
      required:
        - email
        - password
        - name
    VerifyEmailOtpDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
        code:
          type: string
          example: '123456'
      required:
        - email
        - code
    EmailDto:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
      required:
        - email
    AuthSessionEntity:
      type: object
      properties:
        id:
          type: string
          example: 08aa78d7-65ce-4bb7-92e7-a0c7274f868d
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        ipAddress:
          type: string
          example: 203.0.113.18
          nullable: true
        createdAt:
          format: date-time
          type: string
          example: 2026-04-29T21:00:00.000Z
        expiresAt:
          format: date-time
          type: string
          example: 2026-05-06T21:00:00.000Z
        isCurrent:
          type: boolean
          example: true
      required:
        - id
        - userAgent
        - createdAt
        - expiresAt
        - isCurrent
    AuthSessionListEntity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthSessionEntity'
      required:
        - items
    AuthRefreshResult:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
        currentUser:
          description:
            Current user returned with the refreshed tokens so the client can
            load authenticated routes.
          allOf:
            - $ref: '#/components/schemas/UserEntity'
      required:
        - accessToken
        - currentUser
    ResetPasswordDto:
      type: object
      properties:
        password:
          type: string
          example: ExamplePassphrase123!
        token:
          type: string
      required:
        - password
        - token
    AuthGoogleLoginDto:
      type: object
      properties:
        code:
          type: string
          example: abc
        intent:
          type: string
          example: login
          enum:
            - login
            - register
          description:
            Whether the frontend started Google sign-in from login or
            registration
      required:
        - code
    AuthResult:
      type: object
      properties:
        refreshToken:
          type: string
          example: shiovpm.sefdvssfv.ndsgfesdcv
          description: Refresh token. Omitted when refresh tokens are delivered cookie-only.
        accessToken:
          type: string
          example: wrbesef.vrwsaefd.vwsefvs
        isNewUser:
          type: boolean
          example: true
          description: Whether this request created a new account
      required:
        - accessToken
        - isNewUser
    PaginationMeta:
      type: object
      properties:
        totalItemsCount:
          type: number
          example: 1
        itemsPerPage:
          type: number
          example: 20
        currentPage:
          type: number
          example: 1
        totalPages:
          type: number
          example: 1
      required:
        - totalItemsCount
        - itemsPerPage
        - currentPage
        - totalPages
    PaginatedInterests:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - meta
        - items
    SetUserInterestsDto:
      type: object
      properties:
        interestIds:
          example:
            - clx1interest1
            - clx1interest2
            - clx1interest3
            - clx1interest4
            - clx1interest5
          minItems: 5
          maxItems: 50
          type: array
          items:
            type: string
      required:
        - interestIds
    UserInterestsEntity:
      type: object
      properties:
        interests:
          type: array
          items:
            $ref: '#/components/schemas/InterestEntity'
      required:
        - interests
    CreateActivityDto:
      type: object
      properties:
        title:
          type: string
          example: Friday basketball run
        description:
          type: string
          example: Looking for a small group for evening hoops
        city:
          type: string
          example: London
        locationLat:
          type: number
          example: 51.5072
        locationLng:
          type: number
          example: -0.1276
        visibility:
          type: string
          enum:
            - PUBLIC
            - FRIENDS_ONLY
            - INVITE_ONLY
          default: PUBLIC
        access:
          type: string
          enum:
            - OPEN
            - BY_REQUEST
          default: OPEN
        forgeMode:
          type: string
          enum:
            - AUTO
            - MANUAL
          default: AUTO
        interestIds:
          example:
            - clx1interest1
            - clx1interest2
          minItems: 1
          maxItems: 20
          type: array
          items:
            type: string
      required:
        - title
        - interestIds
    ActivityPlanTemplateEntity:
      type: object
      properties:
        id:
          type: string
          example: clx1plan123
        title:
          type: string
          example: Friday evening basketball
        description:
          type: string
          example: Casual pickup game with room for beginners
          nullable: true
        category:
          type: string
          enum:
            - TECH
            - SPORTS
            - ARTS
            - SOCIAL
            - OUTDOORS
            - LEARNING
            - MUSIC
            - FOOD
            - GAMING
            - WELLNESS
            - TRAVEL
            - OTHER
        coverImage:
          type: string
          example: https://example.com/plan-cover.png
          nullable: true
        status:
          type: string
          enum:
            - DRAFT
            - PROPOSED
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        scheduleMode:
          type: string
          enum:
            - TO_BE_DECIDED
            - FIXED
          nullable: true
        dateTime:
          format: date-time
          type: string
          example: 2026-04-30T18:30:00.000Z
          nullable: true
        locationMode:
          type: string
          enum:
            - IN_PERSON
            - ONLINE
            - TBD
        location:
          type: string
          example: Riverside Courts
          nullable: true
        locationLat:
          type: number
          example: 51.5072
          nullable: true
        locationLng:
          type: number
          example: -0.1276
          nullable: true
        cost:
          type: string
          enum:
            - FREE
            - PAID
        costAmount:
          type: number
          example: 12.5
          nullable: true
        costDetails:
          type: string
          example: Court split between members
          nullable: true
        completedAt:
          format: date-time
          type: string
          example: null
          nullable: true
        cancelledAt:
          format: date-time
          type: string
          example: null
          nullable: true
        startingSoonSentAt:
          format: date-time
          type: string
          example: null
          nullable: true
        createdAt:
          format: date-time
          type: string
          example: 2026-04-27T16:00:00.000Z
        updatedAt:
          format: date-time
          type: string
          example: 2026-04-27T16:00:00.000Z
        groupId:
          type: string
          example: clx1group123
      required:
        - id
        - title
        - category
        - status
        - scheduleMode
        - locationMode
        - cost
        - createdAt
        - updatedAt
        - groupId
    ActivityGroupTemplateEntity:
      type: object
      properties:
        id:
          type: string
          example: clx1group123
        name:
          type: string
          example: Friday Basketball Crew
        description:
          type: string
          example: Weekly pickup group for after-work games
          nullable: true
