openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example:
                      Hello! This is the root endpoint. Please use /api/v1 for the API. Docs
                      are available at /api/v1/docs.
                required:
                  - message
        '429':
          description: Too many requests
      summary: Get the API root message and documentation entrypoint
      tags:
        - App
      security: []
  /api/v1/file-upload:
    post:
      operationId: FileUploadController_uploadShare
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'
        '429':
          description: Too many requests
      summary: Upload a public file and return its accessible URL
      tags:
        - FileUpload
      security: []
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      info:
                        type: object
                        example: &a1
                          database: &a2
                            status: up
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example: {}
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example: *a1
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
        '429':
          description: Too many requests
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    example: 503
                    type: integer
                    description: HTTP status code.
                  message:
                    description: Error message.
                    type: object
                    properties:
                      status:
                        type: string
                        example: error
                      info:
                        type: object
                        example: *a1
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example:
                          redis: &a3
                            status: down
                            message: Could not connect
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example:
                          database: *a2
                          redis: *a3
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                  timestamp:
                    example: 2023-08-20T12:34:56Z
                    type: string
                    format: date-time
                    description: Timestamp when the exception occurred.
                  method:
                    example: GET
                    type: string
                    description: HTTP method that triggered the exception.
                  path:
                    example: /api/resource
                    type: string
                    description: Request path that triggered the exception.
                required:
                  - status
                  - timestamp
                  - method
      summary: 'Get state of api. [open for: everyone]'
      tags: &a7
        - Healthcheck
      security: []
  /api/v1/health/frontend:
    get:
      operationId: HealthController_checkFrontend
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      info:
                        type: object
                        example: &a4
                          database: &a5
                            status: up
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example: {}
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example: *a4
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
        '429':
          description: Too many requests
        '503':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    example: 503
                    type: integer
                    description: HTTP status code.
                  message:
                    description: Error message.
                    type: object
                    properties:
                      status:
                        type: string
                        example: error
                      info:
                        type: object
                        example: *a4
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      error:
                        type: object
                        example:
                          redis: &a6
                            status: down
                            message: Could not connect
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                        nullable: true
                      details:
                        type: object
                        example:
                          database: *a5
                          redis: *a6
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                          additionalProperties:
                            type: string
                  timestamp:
                    example: 2023-08-20T12:34:56Z
                    type: string
                    format: date-time
                    description: Timestamp when the exception occurred.
                  method:
                    example: GET
                    type: string
                    description: HTTP method that triggered the exception.
                  path:
                    example: /api/resource
                    type: string
                    description: Request path that triggered the exception.
                required:
                  - status
                  - timestamp
                  - method
      summary: 'Get state of frontend. [open for: everyone]'
      tags: *a7
      security: []
  /api/v1/health/ok:
    get:
      operationId: HealthController_ok
      parameters: []
      responses:
        '200':
          description: ''
        '429':
          description: Too many requests
