<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="TeamForge" />
    <meta name="apple-mobile-web-app-title" content="TeamForge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0D9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090909" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        window.__TEAMFORGE_BOOT_STARTED_AT = performance.now();

        const root = document.documentElement;
        const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)").matches ?? false;
        const theme = prefersLight ? "light" : "dark";

        root.dataset.theme = theme;
        root.classList.add(theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --tf-boot-background: #0b0f0e;
        --tf-boot-foreground: #f2f5f1;
        --tf-boot-canvas: #111716;
        --color-forge-teal: #0d9488;
        --color-spark-amber: #fbbf24;
      }
      :root.light {
        color-scheme: light;
        --tf-boot-background: #f1f4f1;
        --tf-boot-foreground: #1c1f1d;
        --tf-boot-canvas: #f7f8f4;
        --color-spark-amber: #f59e0b;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        background: var(--tf-boot-background);
        min-height: 100%;
        color: var(--tf-boot-foreground);
        margin: 0;
      }
      body {
        overflow-y: scroll;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          sans-serif;
      }
      @supports (scrollbar-gutter: stable) {
        html {
          scrollbar-gutter: stable;
        }
        body {
          overflow-y: auto;
        }
        :root {
          --removed-body-scroll-bar-size: 0px;
        }
        body[data-scroll-locked] {
          padding-right: 0;
          margin-right: 0;
        }
      }
      .tf-boot {
        background:
          radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--color-forge-teal) 10%, transparent), transparent 28%),
          var(--tf-boot-canvas);
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2.5rem 1.5rem;
        display: flex;
      }
      .tf-boot__skip {
        z-index: 1;
        border: 1px solid color-mix(in srgb, var(--color-forge-teal) 60%, transparent);
        background: var(--tf-boot-canvas);
        color: var(--tf-boot-foreground);
        border-radius: 999px;
        padding: 0.625rem 0.875rem;
        font-weight: 700;
        text-decoration: none;
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        transform: translateY(-150%);
      }
      .tf-boot__skip:focus {
        outline: 2px solid var(--color-forge-teal);
        outline-offset: 2px;
        transform: translateY(0);
      }
      .forge-loading-mark {
        align-items: center;
        color: var(--tf-boot-foreground);
        flex-direction: column;
        gap: 0.75rem;
        justify-content: center;
        user-select: none;
        display: flex;
      }
      .forge-loading-mark__svg {
        width: 7rem;
        overflow: visible;
      }
      .forge-loading-mark__hammer,
      .forge-loading-mark__anvil,
      .forge-loading-mark__spark-core,
      .forge-loading-mark__spark,
      .forge-loading-mark__line,
      .forge-loading-mark__glow {
        transform-box: fill-box;
      }
      .forge-loading-mark__hammer {
        transform-box: view-box;
        transform-origin: 151px 94.5px;
        animation: 1.45s infinite tf-boot-hammer;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__anvil {
        transform-box: view-box;
        transform-origin: 110px 148px;
        animation: 1.45s infinite tf-boot-anvil;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__spark-core {
        transform-box: view-box;
        transform-origin: 110px 107.75px;
        animation: 1.45s infinite tf-boot-core-spark;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__spark {
        animation: 1.45s infinite tf-boot-spark;
        animation-delay: calc(
          var(--forge-loading-animation-offset, 0ms) + var(--spark-delay)
        );
        opacity: 0;
        transform-origin: 50%;
      }
      @keyframes tf-boot-hammer {
        0% {
          transform: rotate(0);
        }
        28% {
          transform: rotate(55deg);
        }
        50% {
          transform: rotate(60deg);
        }
        54% {
          transform: rotate(-3deg);
        }
        64% {
          transform: rotate(3deg);
        }
        to {
          transform: rotate(0);
        }
      }
      @keyframes tf-boot-anvil {
        0%,
        50%,
        to {
          transform: translateY(0) scaleY(1);
        }
        54% {
          transform: translateY(1.25px) scaleY(0.965);
        }
        64% {
          transform: translateY(-0.25px) scaleY(1.01);
        }
      }
      @keyframes tf-boot-core-spark {
        0%,
        28%,
        50%,
        to {
          opacity: 0.65;
          transform: scaleX(1);
        }
        54% {
          opacity: 1;
          transform: scaleX(1.34);
        }
        64% {
          opacity: 0.82;
          transform: scaleX(1.08);
        }
      }
      @keyframes tf-boot-spark {
        0%,
        50% {
          opacity: 0;
          transform: translate(0) scale(0);
        }
        53% {
          opacity: 1;
          transform: translate(var(--spark-x), var(--spark-y)) scale(1);
        }
        75% {
          opacity: 0.82;
          transform: translate(calc(var(--spark-x) * 1.08), calc(var(--spark-y) + 10px)) scale(0.82);
        }
        to {
          opacity: 0;
          transform: translate(calc(var(--spark-x) * 1.18), calc(var(--spark-y) + 25px)) scale(0);
        }
      }
      @keyframes tf-boot-swoosh-top {
        0%,
        49% {
          stroke-dashoffset: 65px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 65px;
          opacity: 0.6;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.6;
        }
        75%,
        to {
          stroke-dashoffset: -65px;
          opacity: 0;
        }
      }
      @keyframes tf-boot-swoosh-mid {
        0%,
        49% {
          stroke-dashoffset: 60px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 60px;
          opacity: 0.4;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.4;
        }
        75%,
        to {
          stroke-dashoffset: -60px;
          opacity: 0;
        }
      }
      @keyframes tf-boot-swoosh-bot {
        0%,
        49% {
          stroke-dashoffset: 50px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 50px;
          opacity: 0.25;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.25;
        }
        75%,
        to {
          stroke-dashoffset: -50px;
          opacity: 0;
        }
      }
      .forge-loading-mark__swoosh-top {
        stroke-dasharray: 65;
        stroke-dashoffset: 65;
        opacity: 0;
        animation: 1.45s infinite tf-boot-swoosh-top;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__swoosh-mid {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        opacity: 0;
        animation: 1.45s infinite tf-boot-swoosh-mid;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__swoosh-bot {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        opacity: 0;
        animation: 1.45s infinite tf-boot-swoosh-bot;
        animation-delay: var(--forge-loading-animation-offset, 0ms);
      }
      .forge-loading-mark__line {
        opacity: 0.32;
      }
      .forge-loading-mark__glow {
        opacity: 0.08;
      }
      @media (prefers-reduced-motion: reduce) {
        .forge-loading-mark__hammer,
        .forge-loading-mark__anvil,
        .forge-loading-mark__spark-core,
        .forge-loading-mark__spark,
        .forge-loading-mark__swoosh-top,
        .forge-loading-mark__swoosh-mid,
        .forge-loading-mark__swoosh-bot {
          animation: none;
        }
        .forge-loading-mark__spark {
          opacity: 0;
        }
      }
    </style>
