    <style>
      :root {
        color-scheme: dark;
        --app-boot-background: #000000;
        --app-boot-foreground: #ffffff;
        --app-boot-canvas: #080808;
        --color-brand-teal: #0d9488;
        --color-brand-amber: #fbbf24;
      }
      :root.light {
        color-scheme: light;
        --app-boot-background: #f5f5f3;
        --app-boot-foreground: #171717;
        --app-boot-canvas: #ffffff;
        --color-brand-amber: #f59e0b;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        background: var(--app-boot-background);
        min-height: 100%;
        color: var(--app-boot-foreground);
        margin: 0;
      }
      html {
        overflow-y: scroll;
      }
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          sans-serif;
      }
      @supports (scrollbar-gutter: stable) {
        html {
          scrollbar-gutter: stable;
        }
        body {
          overflow-y: visible;
        }
        :root {
          --removed-body-scroll-bar-size: 0px;
        }
        body[data-scroll-locked] {
          padding-right: 0;
          margin-right: 0;
        }
      }
      .app-boot {
        background: var(--app-boot-canvas);
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2.5rem 1.5rem;
        display: flex;
      }
      .app-boot__skip {
        z-index: 1;
        border: 1px solid color-mix(in srgb, var(--color-brand-teal) 60%, transparent);
        background: var(--app-boot-canvas);
        color: var(--app-boot-foreground);
        border-radius: 999px;
        padding: 0.625rem 0.875rem;
        font-weight: 700;
        text-decoration: none;
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        transform: translateY(-150%);
      }
      .app-boot__skip:focus {
        outline: 2px solid var(--color-brand-teal);
        outline-offset: 2px;
        transform: translateY(0);
      }
      .plan-creation-loading-mark {
        align-items: center;
        color: var(--app-boot-foreground);
        flex-direction: column;
        gap: 0.75rem;
        justify-content: center;
        user-select: none;
        display: flex;
      }
      .plan-creation-loading-mark__svg {
        width: 7rem;
        overflow: visible;
      }
      .plan-creation-loading-mark__moving-shape,
      .plan-creation-loading-mark__loadingMark,
      .plan-creation-loading-mark__particle-core,
      .plan-creation-loading-mark__particle,
      .plan-creation-loading-mark__line,
      .plan-creation-loading-mark__glow {
        transform-box: fill-box;
      }
      .plan-creation-loading-mark__moving-shape {
        transform-box: view-box;
        transform-origin: 151px 94.5px;
        animation: 1.45s infinite app-boot-moving-shape;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__loadingMark {
        transform-box: view-box;
        transform-origin: 110px 148px;
        animation: 1.45s infinite app-boot-loadingMark;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__particle-core {
        transform-box: view-box;
        transform-origin: 110px 107.75px;
        animation: 1.45s infinite app-boot-core-particle;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__particle {
        animation: 1.45s infinite app-boot-particle;
        animation-delay: calc(
          var(--plan-creation-loading-animation-offset, 0ms) + var(--particle-delay)
        );
        opacity: 0;
        transform-origin: 50%;
      }
      @keyframes app-boot-moving-shape {
        0% {
          transform: rotate(0);
        }
        28% {
          transform: rotate(55deg);
        }
        50% {
          transform: rotate(60deg);
        }
        54% {
          transform: rotate(-3deg);
        }
        64% {
          transform: rotate(3deg);
        }
        to {
          transform: rotate(0);
        }
      }
      @keyframes app-boot-loadingMark {
        0%,
        50%,
        to {
          transform: translateY(0) scaleY(1);
        }
        54% {
          transform: translateY(1.25px) scaleY(0.965);
        }
        64% {
          transform: translateY(-0.25px) scaleY(1.01);
        }
      }
      @keyframes app-boot-core-particle {
        0%,
        28%,
        50%,
        to {
          opacity: 0.65;
          transform: scaleX(1);
        }
        54% {
          opacity: 1;
          transform: scaleX(1.34);
        }
        64% {
          opacity: 0.82;
          transform: scaleX(1.08);
        }
      }
      @keyframes app-boot-particle {
        0%,
        50% {
          opacity: 0;
          transform: translate(0) scale(0);
        }
        53% {
          opacity: 1;
          transform: translate(var(--particle-x), var(--particle-y)) scale(1);
        }
        75% {
          opacity: 0.82;
          transform: translate(calc(var(--particle-x) * 1.08), calc(var(--particle-y) + 10px)) scale(0.82);
        }
        to {
          opacity: 0;
          transform: translate(calc(var(--particle-x) * 1.18), calc(var(--particle-y) + 25px)) scale(0);
        }
      }
      @keyframes app-boot-swoosh-top {
        0%,
        49% {
          stroke-dashoffset: 65px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 65px;
          opacity: 0.6;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.6;
        }
        75%,
        to {
          stroke-dashoffset: -65px;
          opacity: 0;
        }
      }
      @keyframes app-boot-swoosh-mid {
        0%,
        49% {
          stroke-dashoffset: 60px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 60px;
          opacity: 0.4;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.4;
        }
        75%,
        to {
          stroke-dashoffset: -60px;
          opacity: 0;
        }
      }
      @keyframes app-boot-swoosh-bot {
        0%,
        49% {
          stroke-dashoffset: 50px;
          opacity: 0;
        }
        50% {
          stroke-dashoffset: 50px;
          opacity: 0.25;
        }
        53% {
          stroke-dashoffset: 0;
          opacity: 0.25;
        }
        75%,
        to {
          stroke-dashoffset: -50px;
          opacity: 0;
        }
      }
      .plan-creation-loading-mark__swoosh-top {
        stroke-dasharray: 65;
        stroke-dashoffset: 65;
        opacity: 0;
        animation: 1.45s infinite app-boot-swoosh-top;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__swoosh-mid {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        opacity: 0;
        animation: 1.45s infinite app-boot-swoosh-mid;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__swoosh-bot {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        opacity: 0;
        animation: 1.45s infinite app-boot-swoosh-bot;
        animation-delay: var(--plan-creation-loading-animation-offset, 0ms);
      }
      .plan-creation-loading-mark__line {
        opacity: 0.32;
      }
      .plan-creation-loading-mark__glow {
        opacity: 0.08;
      }
      @media (prefers-reduced-motion: reduce) {
        .plan-creation-loading-mark__moving-shape,
        .plan-creation-loading-mark__loadingMark,
        .plan-creation-loading-mark__particle-core,
        .plan-creation-loading-mark__particle,
        .plan-creation-loading-mark__swoosh-top,
        .plan-creation-loading-mark__swoosh-mid,
        .plan-creation-loading-mark__swoosh-bot {
          animation: none;
        }
        .plan-creation-loading-mark__particle {
          opacity: 0;
        }
      }
    </style>
